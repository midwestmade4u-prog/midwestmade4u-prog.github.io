<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MidwestMade4U — Free Printables</title>
<meta name="description" content="Free printable planners and trackers for homeschool families and teachers, from MidwestMade4U.">
<style>
 :root{--navy:#1B2A4A;--gold:#C8A44A;--cream:#FDF8F0;--ink:#2B2B2B;--mute:#6B6B6B;--rule:#D8D2C4;--card:#fff}
 @media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--cream:#14181f;--ink:#eae6dd;--mute:#9aa1ad;--rule:#2b323d;--card:#1b212b}}
 *{box-sizing:border-box}
 body{margin:0;background:var(--cream);color:var(--ink);font:17px/1.6 ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
 header{background:var(--navy);color:#FDF8F0;padding:56px 20px;text-align:center}
 header h1{margin:0 0 8px;font-size:clamp(26px,5vw,40px)}
 header p{margin:0;color:#D9D3C6}
 .wrap{max-width:720px;margin:0 auto;padding:36px 20px 64px}
 a.card{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--rule);
        border-radius:12px;padding:24px;margin:0 0 16px}
 a.card:hover{border-color:var(--gold)}
 a.card strong{display:block;font-size:19px;color:var(--navy);margin-bottom:4px}
 @media(prefers-color-scheme:dark){:root:not([data-theme="light"]) a.card strong{color:var(--gold)}}
 a.card span{color:var(--mute);font-size:15px}
 footer{color:var(--mute);font-size:14px;text-align:center;padding:0 20px 40px}
 footer a{color:inherit}
</style></head><body>
<header>
  <h1>MidwestMade4U</h1>
  <p>Free printables for homeschool families and teachers</p>
</header>
<div class="wrap">
  <a class="card" href="homeschool-attendance-tracker/">
    <strong>Homeschool Attendance Tracker</strong>
    <span>A whole school year on one page. Undated. Printable and fillable — free, no email required.</span>
  </a>
</div>
<footer>
  MidwestMade4U · Wisconsin · <a href="https://midwestmade4u.etsy.com">Shop on Etsy</a>
</footer>
</body></html>
